<div class="ui mb-paste">
  <anvil-component type="Label" name="heading" prop:role='["dlg-title"]'></anvil-component>
  <anvil-component type="Label" name="intro" prop:role='["fine-print"]'></anvil-component>
  <div class="ui-stack">
    <label class="ui-field" anvil:name="title_field"><span>Title</span>
      <anvil-component type="TextBox" name="title_box" prop:placeholder="My talk"></anvil-component>
    </label>
    <label class="ui-field"><span>Script</span>
      <anvil-component type="TextArea" name="script_box" prop:placeholder="Paste or type your talk here…" prop:height="220"></anvil-component>
    </label>
    <anvil-component type="Label" name="count" prop:role='["fine-print"]'></anvil-component>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="ok_button" prop:text="Make cards" prop:role='["btn", "btn-primary", "ic-cards"]'></anvil-component>
    </div>
  </div>
</div>
