<div class="bs-goal-item">
  <button type="button" class="bs-goal" anvil:name="btn" anvil:on-dom:click="self.goal_click">
    <anvil-component type="Label" name="name" bind:text="self.item['name']" prop:role='["bs-goal-n"]'></anvil-component>
    <anvil-component type="Label" name="blurb" bind:text="self.item['blurb']" prop:role='["bs-goal-b"]'></anvil-component>
  </button>
</div>
