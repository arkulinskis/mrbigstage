<div class="tk-c-item">
  <div class="ui-card tk-c">
    <anvil-component type="Label" name="no" prop:role='["tk-no"]'></anvil-component>
    <div>
      <anvil-component type="TextArea" name="text_box" prop:placeholder="What you'll say on this card…" prop:role='["tk-text"]'></anvil-component>
      <div class="slide"><span><i class="ic ic-image"></i> Screen</span>
        <anvil-component type="TextBox" name="slide_box" prop:placeholder="Big words behind you (optional)"></anvil-component>
      </div>
      <anvil-component type="Label" name="est" prop:role='["tk-est"]'></anvil-component>
    </div>
    <div class="tools">
      <anvil-component type="Button" name="up_button" prop:text="Move up" prop:role='["btn", "btn-ghost", "btn-icon", "btn-sm", "ic-up"]'></anvil-component>
      <anvil-component type="Button" name="down_button" prop:text="Move down" prop:role='["btn", "btn-ghost", "btn-icon", "btn-sm", "ic-down"]'></anvil-component>
      <anvil-component type="Button" name="rm_button" prop:text="Remove card" prop:role='["btn", "btn-ghost", "btn-icon", "btn-sm", "ic-trash"]'></anvil-component>
    </div>
  </div>
</div>
