<div class="lp-part-item">
  <div class="ui-card lp-part">
    <i class="ic" anvil:name="icon"></i>
    <anvil-component type="Label" name="label" bind:text="self.item['label']" prop:role='["lp-part-h"]'></anvil-component>
    <anvil-component type="Label" name="what" bind:text="self.item['what']" prop:role='["lp-part-p"]'></anvil-component>
    <anvil-component type="Label" name="weight" prop:role='["lp-part-w"]'></anvil-component>
  </div>
</div>
